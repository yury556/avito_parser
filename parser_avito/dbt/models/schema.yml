version: 2

sources:
  - name: raw
    database: raw_dwh
    schema: raw
    tables:
      - name: ads
        description: "Сырые данные объявлений с Avito"
      - name: price_history
        description: "История изменения цен"

models:
  - name: normalized_ads
    description: "Нормализованные объявления: категория, бренд, ценовой сегмент"
    columns:
      - name: avito_id
        description: "ID объявления на Avito"
        tests:
          - unique
          - not_null
      - name: price
        description: "Цена в рублях"
        tests:
          - not_null
      - name: category_auto
        description: "Автоматически определённая категория"
      - name: price_tier
        description: "Ценовой сегмент: budget / medium / premium / flagship"

  - name: daily_category_stats
    description: "Ежедневная статистика: кол-во объявлений, средняя цена, уникальные продавцы"

  - name: top_expensive
    description: "Топ-10 самых дорогих активных объявлений"
    columns:
      - name: title
        description: "Название товара"
      - name: price
        description: "Цена в рублях (отсортировано по убыванию)"