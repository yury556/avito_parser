x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-metadb:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-metadb:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: avito-parser-dev-secret
    PYTHONPATH: /opt/airflow/include
    POSTGRES_DB: ${POSTGRES_DB:-avito_dwh}
    POSTGRES_USER: ${POSTGRES_USER:-avito}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito123}
    POSTGRES_HOST: ${POSTGRES_HOST:-external-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    AVITO_SEARCH_URLS: ${AVITO_SEARCH_URLS:-https://www.avito.ru/moskva?q=iphone}
    AVITO_MAX_PAGES: ${AVITO_MAX_PAGES:-1}
    AVITO_REQUEST_TIMEOUT: ${AVITO_REQUEST_TIMEOUT:-20}
    AVITO_USER_AGENT: ${AVITO_USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36}
    AVITO_PROXY_STRING: ${AVITO_PROXY_STRING:-}
    AVITO_PROXY_CHANGE_URL: ${AVITO_PROXY_CHANGE_URL:-}
    AVITO_COOKIES_API_KEY: ${AVITO_COOKIES_API_KEY:-}
    AVITO_USE_BYPASS_API: ${AVITO_USE_BYPASS_API:-false}
    AVITO_USE_OWN_COOKIES: ${AVITO_USE_OWN_COOKIES:-false}
    AVITO_MIN_PRICE: ${AVITO_MIN_PRICE:-0}
    AVITO_MAX_PRICE: ${AVITO_MAX_PRICE:-999999999}
    AVITO_WHITE_LIST: ${AVITO_WHITE_LIST:-}
    AVITO_BLACK_LIST: ${AVITO_BLACK_LIST:-}
    AVITO_SELLER_BLACK_LIST: ${AVITO_SELLER_BLACK_LIST:-}
    AVITO_MAX_AGE: ${AVITO_MAX_AGE:-86400}
    AVITO_IGNORE_RESERV: ${AVITO_IGNORE_RESERV:-true}
    AVITO_IGNORE_PROMOTION: ${AVITO_IGNORE_PROMOTION:-false}
    AVITO_PARSE_VIEWS: ${AVITO_PARSE_VIEWS:-false}
    AVITO_RETRY_DELAY: ${AVITO_RETRY_DELAY:-5}
    AVITO_BLOCK_THRESHOLD: ${AVITO_BLOCK_THRESHOLD:-3}
    AVITO_PAUSE_BETWEEN_LINKS: ${AVITO_PAUSE_BETWEEN_LINKS:-5}
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./dbt:/opt/airflow/dbt
    - ./airflow-logs:/opt/airflow/logs
    - ../parser_avito/result:/opt/airflow/parser_result
  depends_on:
    airflow-metadb:
      condition: service_healthy
    redis:
      condition: service_healthy
    external-postgres:
      condition: service_healthy

x-superset-common: &superset-common
  build:
    context: .
    dockerfile: docker/superset/Dockerfile
  environment: &superset-common-env
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-this-superset-secret-before-production}
    SUPERSET_META_DB_HOST: superset-metadb
    SUPERSET_META_DB_PORT: "5432"
    SUPERSET_META_DB_NAME: ${SUPERSET_META_DB_NAME:-superset}
    SUPERSET_META_DB_USER: ${SUPERSET_META_DB_USER:-superset}
    SUPERSET_META_DB_PASSWORD: ${SUPERSET_META_DB_PASSWORD:-superset}
    SUPERSET_REDIS_HOST: superset-redis
    SUPERSET_REDIS_PORT: "6379"
  volumes:
    - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    - superset_home:/app/superset_home

services:
  external-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avito_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito123}
    ports:
      - "5433:5432"
    volumes:
      - external_pgdata:/var/lib/postgresql/data
      - ./sql/init_external_postgres.sql:/docker-entrypoint-initdb.d/001_init_external_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avito} -d ${POSTGRES_DB:-avito_dwh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-metadb:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email airflow@example.com || true

  airflow-webserver:
    <<: *airflow-common
    restart: unless-stopped
    ports:
      - "8081:8080"
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-postgres:
        condition: service_healthy

  airflow-worker:
    <<: *airflow-common
    restart: unless-stopped
    command: >
      bash -lc "exec celery --app airflow.providers.celery.executors.celery_executor.app worker
      --loglevel INFO
      --pidfile=/tmp/celery-worker.pid
      --concurrency ${AIRFLOW_WORKER_CONCURRENCY:-2}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-metadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      external-postgres:
        condition: service_healthy

  dbt:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    restart: unless-stopped
    working_dir: /opt/airflow/dbt
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        dbt --version
        tail -f /dev/null
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avito_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito123}
      POSTGRES_HOST: ${POSTGRES_HOST:-external-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ./dbt:/opt/airflow/dbt
    depends_on:
      external-postgres:
        condition: service_healthy

  avito-parser-service:
    build:
      context: ../parser_avito
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - ../parser_avito/result:/app/result
      - ../parser_avito/entrypoint.sh:/app/entrypoint.sh:ro
      - ../parser_avito/config.toml:/app/config.toml:ro
    environment:
      PYTHONPATH: /app
      POSTGRES_HOST: external-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: avito_dwh
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito123
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: avito-images
      MAX_IMAGES_PER_AD: "10"
      DOWNLOAD_TIMEOUT: "30"
      MAX_IMAGE_SIZE_MB: "10"
    command: ["bash", "/app/entrypoint.sh"]
    depends_on:
      external-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  image-downloader:
    build:
      context: ../parser_avito
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python3", "/app/image_downloader_service.py"]
    environment:
      PYTHONPATH: /app/src
      POSTGRES_HOST: external-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: avito_dwh
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito123
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: avito-images
      BATCH_SIZE: "20"
      DELAY_BETWEEN_ADS: "2.0"
      DELAY_BETWEEN_BATCHES: "60"
      MAX_IMAGES_PER_AD: "10"
      MAX_IMAGE_SIZE_MB: "10"
      DOWNLOAD_TIMEOUT: "30"
      REQUEST_TIMEOUT: "20"
    volumes:
      - ../parser_avito/image_downloader_service.py:/app/image_downloader_service.py:ro
    depends_on:
      external-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  superset-metadb:
      image: postgres:16
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${SUPERSET_META_DB_NAME:-superset}
        POSTGRES_USER: ${SUPERSET_META_DB_USER:-superset}
        POSTGRES_PASSWORD: ${SUPERSET_META_DB_PASSWORD:-superset}
      volumes:
        - superset_pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_META_DB_USER:-superset} -d ${SUPERSET_META_DB_NAME:-superset}"]
        interval: 5s
        timeout: 5s
        retries: 10

  superset-init:
    <<: *superset-common
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        superset db upgrade
        superset fab create-admin \
          --username "${SUPERSET_ADMIN_USERNAME:-superset}" \
          --firstname "${SUPERSET_ADMIN_FIRSTNAME:-Superset}" \
          --lastname "${SUPERSET_ADMIN_LASTNAME:-Admin}" \
          --email "${SUPERSET_ADMIN_EMAIL:-superset@example.com}" \
          --password "${SUPERSET_ADMIN_PASSWORD:-superset}" || true
        superset init
    depends_on:
      superset-metadb:
        condition: service_healthy
      superset-redis:
        condition: service_healthy

  superset-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset:
    <<: *superset-common
    restart: unless-stopped
    command: superset run -h 0.0.0.0 -p 8088 --with-threads
    ports:
      - "${SUPERSET_HOST_PORT:-18088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_healthy

  superset-worker:
    <<: *superset-common
    restart: unless-stopped
    working_dir: /app/superset_home
    command: celery --app=superset.tasks.celery_app:app worker --loglevel=INFO
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_healthy

  superset-beat:
    <<: *superset-common
    restart: unless-stopped
    working_dir: /app/superset_home
    command: celery --app=superset.tasks.celery_app:app beat --loglevel=INFO
    depends_on:
      superset-init:
        condition: service_completed_successfully
      superset-redis:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9002"
    ports:
      - "9000:9000"
      - "9002:9002"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    ports:
      - "8123:8123"       # HTTP API (REST, Superset)
      - "9004:9000"       # Native TCP (clickhouse-client, mapped ≠ minio 9000)
    environment:
      CLICKHOUSE_DB: mart
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  external_pgdata:
  airflow_pgdata:
  superset_pgdata:
  superset_home:
  minio_data:
  clickhouse_data: