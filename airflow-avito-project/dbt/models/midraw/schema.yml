version: 2

models:
  - name: avito_ads
    description: Typed table built from raw CSV Avito rows.
    columns:
      - name: avito_id
        tests:
          - not_null
      - name: title
        tests:
          - not_null
      - name: url
        tests:
          - not_null
      - name: description
        description: Full text of the Avito ad listing
      - name: source_system
        tests:
          - accepted_values:
              arguments:
                values: ["avito", "synthetic_avito"]
