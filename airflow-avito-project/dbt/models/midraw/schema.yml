version: 2

models:
  - name: avito_ads
    description: Typed midraw table built from raw CSV Avito rows.
    columns:
      - name: run_id
        tests:
          - not_null
      - name: row_number
        tests:
          - not_null
      - name: avito_id
        tests:
          - not_null
      - name: title
        tests:
          - not_null
      - name: url
        tests:
          - not_null
      - name: source_system
        tests:
          - accepted_values:
              arguments:
                values: ["avito", "synthetic_avito"]
