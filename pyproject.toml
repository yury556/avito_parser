[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "avito_parser"
version = "3.2.16"
description = "Avito Parser — enterprise-structured"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.13.4",
    "curl-cffi",
    "flet==0.24.1",
    "httpx",
    "loguru==0.7.0",
    "openpyxl==3.1.5",
    "playwright==1.52.0",
    "pydantic==2.9.2",
    "requests==2.32.3",
    "tomli-w==1.2.0",
    "tzdata==2025.2",
    "tzlocal==5.3.1",
]

[project.scripts]
avito-parser = "avito_parser.__main__:main"
avito-parser-run = "avito_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
