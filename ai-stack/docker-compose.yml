# AI Stack — ai_enrich микросервис (подключён к сети airflow-проекта)
name: ai-stack
services:
  ai_enrich:
    build:
      context: ./services/ai_enrich
      dockerfile: Dockerfile
    restart: always
    container_name: ai-stack-ai_enrich-1
    ports:
      - ${AI_ENRICH_PORT:-8000}:8000
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - AI_MODEL=${AI_MODEL:-google/gemma-4-26b-a4b-it:free}
      - DB_HOST=${DB_HOST:-external-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-avito_dwh}
      - DB_USER=${DB_USER:-avito}
      - DB_PASSWORD=${DB_PASSWORD:-avito123}
      - AI_PROMPT_VERSION=${AI_PROMPT_VERSION:-v2}
      # Постоянный последовательный worker; внутри batch остаётся 5 параллельных AI-запросов.
      - WORKER_ENABLED=${AI_WORKER_ENABLED:-true}
      - PARALLEL_WORKERS=${PARALLEL_WORKERS:-5}
      - AI_BATCH_LIMIT=${AI_BATCH_LIMIT:-50}
      - IDLE_SLEEP=${IDLE_SLEEP:-10}
      - WORKER_BACKOFF_BASE=${WORKER_BACKOFF_BASE:-2}
      - WORKER_BACKOFF_MAX=${WORKER_BACKOFF_MAX:-60}
    networks:
      - ai-net
      - airflow-net
networks:
  ai-net:
    driver: bridge
  airflow-net:
    external: true
    name: airflow-avito-project_default
