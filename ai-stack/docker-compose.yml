# AI Stack — ai_enrich микросервис (подключён к сети airflow-проекта)
name: ai-stack
services:
  ai_enrich:
    build:
      context: ./services/ai_enrich
      dockerfile: Dockerfile
    restart: always
    container_name: ai-stack-ai_enrich-1
    ports:
      - ${AI_ENRICH_PORT:-8000}:8000
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - AI_MODEL=${AI_MODEL:-google/gemma-4-26b-a4b-it:free}
      - DB_HOST=${DB_HOST:-external-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-avito_dwh}
      - DB_USER=${DB_USER:-avito}
      - DB_PASSWORD=${DB_PASSWORD:-avito123}
      - AI_PROMPT_VERSION=${AI_PROMPT_VERSION:-v1}
    networks:
      - ai-net
      - airflow-net
networks:
  ai-net:
    driver: bridge
  airflow-net:
    external: true
    name: airflow-avito-project_default
